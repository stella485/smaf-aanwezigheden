<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMAF Aanwezigheden</title>
<meta name="description" content="Aanwezigheden bijhouden voor de leiding van Scouts Sint-Michiel / Anne Frank.">
<meta name="theme-color" content="#0b0a2e">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SMAF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Stardos+Stencil:wght@400;700&display=swap">
<style>
/* SMAF-huisstijl: nachtblauw, magenta, wit, stencilletters */
:root{
  --bg:#f3f2f8; --surface:#ffffff; --surface-2:#e8e6f1; --ink:#0d0b2b; --ink-2:#433f63; --muted:#6c6887; --line:#d9d6e6;
  --accent:#b4169f; --accent-ink:#ffffff; --accent-soft:#f6dcf1;
  --brand-bg:#0b0a2e; --brand-ink:#ffffff; --brand-accent:#e02dcb; --brand-line:rgba(255,255,255,.14);
  --das:#b4169f; --das-soft:#f6dcf1;
  --ok:#1f8a4c; --ok-soft:#d7efe0; --msg:#2d67c2; --msg-soft:#dce7f8; --no:#d2451f; --no-soft:#fbe0d6;
  --shadow:0 1px 2px rgba(13,11,43,.06),0 4px 14px rgba(13,11,43,.05);
  --display:"Stardos Stencil","Rockwell","Georgia",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#07061d; --surface:#12113a; --surface-2:#1c1a4a; --ink:#f3f2fa; --ink-2:#c3c0dc; --muted:#8f8bb0; --line:#2a2858;
    --accent:#e84fd6; --accent-ink:#0b0a2e; --accent-soft:#3a1540;
    --brand-bg:#000000; --brand-line:rgba(255,255,255,.12);
    --das:#e84fd6; --das-soft:#3a1540;
    --ok:#43c079; --ok-soft:#133426; --msg:#6b9ceb; --msg-soft:#172a4d; --no:#f07a55; --no-soft:#3d1d14;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07061d; --surface:#12113a; --surface-2:#1c1a4a; --ink:#f3f2fa; --ink-2:#c3c0dc; --muted:#8f8bb0; --line:#2a2858;
  --accent:#e84fd6; --accent-ink:#0b0a2e; --accent-soft:#3a1540;
  --brand-bg:#000000; --brand-line:rgba(255,255,255,.12);
  --das:#e84fd6; --das-soft:#3a1540;
  --ok:#43c079; --ok-soft:#133426; --msg:#6b9ceb; --msg-soft:#172a4d; --no:#f07a55; --no-soft:#3d1d14;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand-bg);color:var(--brand-ink);padding-block:14px 12px;margin-inline:-16px;padding-inline:16px;box-shadow:0 1px 0 var(--brand-line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;flex-direction:column;line-height:1;min-width:0}
.logo .smaf{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.01em;color:var(--brand-accent)}
.logo .smaf-sub{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.06em;color:var(--brand-accent);margin-top:3px;white-space:nowrap}
.brand-txt{text-align:right;min-width:0}
.brand h1{font-size:19px;line-height:1.1;color:var(--brand-ink);text-transform:uppercase;letter-spacing:.04em}
.brand p{margin:3px 0 0;color:rgba(255,255,255,.72);font-size:13px}
.takbar{display:flex;gap:8px;overflow-x:auto;padding-top:12px;scrollbar-width:none}
.takbar::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.top .chip{background:transparent;border-color:rgba(255,255,255,.3);color:var(--brand-ink)}
.top .chip[aria-pressed="true"]{background:var(--brand-accent);border-color:var(--brand-accent);color:#fff}
.card h2{text-transform:uppercase;letter-spacing:.03em}

/* generic */
.stack{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:18px}
.card h3{font-size:15px;color:var(--ink-2)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hint{color:var(--muted);font-size:13.5px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1 1 160px;min-width:0}
label.lbl{display:block;font-size:13px;color:var(--ink-2);font-weight:700;margin-bottom:4px}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:64px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--no-soft);color:var(--no)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;color:var(--ink-2);padding:22px 8px}
.banner{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface);color:var(--ink);font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* activity nav */
.actnav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.navbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer;line-height:1}
.acthead{text-align:center;min-width:0}
.acthead .date{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.acthead .sub{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2)}
.tag.today{background:var(--das-soft);color:var(--das)}
.tag.kind-extra{background:var(--accent-soft);color:var(--accent)}
.tag.kind-weekend,.tag.kind-kamp{background:var(--msg-soft);color:var(--msg)}
.tag.off{background:var(--no-soft);color:var(--no)}

/* summary */
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13.5px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.msg{background:var(--msg-soft);color:var(--msg)}.pill.no{background:var(--no-soft);color:var(--no)}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent)}

/* members */
.lid{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.lid:first-of-type{border-top:0}
.lid-name{font-weight:700;overflow-wrap:anywhere}
.lid-name .arch{font-weight:400;color:var(--muted);font-size:13px}
.lid-meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.lid-meta .n{color:var(--ink-2);font-style:italic}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{width:46px;height:44px;border:0;background:var(--surface);font-size:18px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[data-s="aanwezig"][aria-pressed="true"]{background:var(--ok);color:#fff}
.seg button[data-s="afgemeld"][aria-pressed="true"]{background:var(--msg);color:#fff}
.seg button[data-s="afwezig"][aria-pressed="true"]{background:var(--no);color:#fff}
.iconbtn{width:40px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);font-size:17px}
.iconbtn[aria-expanded="true"],.iconbtn.has{color:var(--accent)}
.lid-note{grid-column:1/-1}

/* overview */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:4px 10px;padding-block:10px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.mrow:first-of-type{border-top:0}
.mrow .nm{font-weight:700;overflow-wrap:anywhere}
.mrow .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mrow.warn .pct{color:var(--no)}
.mrow .bar{grid-column:1/2;display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.mrow .bar i{display:block;height:100%}
.mrow .cnt{font-size:12.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;padding:8px 10px;background:var(--surface-2);border-radius:10px;font-size:13.5px}
.hist div{display:flex;gap:8px}
.hist .g{width:18px;text-align:center;font-weight:700}
.g.aanwezig{color:var(--ok)}.g.afgemeld{color:var(--msg)}.g.afwezig{color:var(--no)}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);border-top:0;text-transform:uppercase;letter-spacing:.06em}
td.c,th.c{text-align:center;font-variant-numeric:tabular-nums}
td.warn{color:var(--das);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* manage */
.item{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item.inactive .grow input{color:var(--muted)}
.blocked{display:flex;flex-wrap:wrap;gap:6px}
.blocked span{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:8px;padding:3px 4px 3px 10px;font-size:13.5px}
.blocked button{border:0;background:none;cursor:pointer;color:var(--muted);width:28px;height:28px}
.who{display:flex;align-items:center;gap:10px}
.who img{width:32px;height:32px;border-radius:50%}

/* bottom nav + toast */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom div{display:flex;max-width:640px;width:100%}
.bottom button{flex:1;background:none;border:0;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottom button svg{width:24px;height:24px}
.bottom button[aria-current="page"]{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:420px){.seg button{width:42px}.stat b{font-size:20px}}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:15px;letter-spacing:.02em;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" role="img" aria-label="SMAF, Scouts Sint-Michiel / Anne Frank"><span class="smaf" aria-hidden="true">SMAF</span><span class="smaf-sub" aria-hidden="true">SINT-MICHIEL / ANNE FRANK</span></div>
      <div class="brand-txt"><h1>Aanwezigheden</h1><p id="subtitle">Laden…</p></div>
    </div>
    <div class="takbar" id="takBar" role="group" aria-label="Kies een tak"></div>
    <div id="banner" class="banner" hidden></div>
  </header>
  <main>
    <section id="v-login" class="stack"></section>
    <section id="v-att" class="stack" hidden></section>
    <section id="v-ov" class="stack" hidden></section>
    <section id="v-set" class="stack" hidden></section>
  </main>
</div>
<nav class="bottom" id="nav" aria-label="Hoofdmenu" hidden><div>
  <button data-act="view" data-v="att" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M9 12l2 2 4-4M9 17h6"/></svg>Aanwezigheid</button>
  <button data-act="view" data-v="ov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16M7 16V9M12 16V5M17 16v-4"/></svg>Overzicht</button>
  <button data-act="view" data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4a3 3 0 010 6M18 14c1.8.7 3 2.5 3 4.6"/></svg>Beheer</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
